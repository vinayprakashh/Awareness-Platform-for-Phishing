<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Instantly check suspicious messages, screenshots, links and app downloads for phishing, digital arrest scams and malicious apps. Private, free and no login required."
    />
    <meta name="theme-color" content="#050c18" />
    <script>
      // Apply the saved (or system) theme before React renders to avoid a flash.
      // Keep in sync with src/lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('verifypoint-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
          if (theme === 'light') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f8fafc');
          }
        } catch (_) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <title>VerifyPoint — Cyber Security Awareness Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
